<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - Kumrawat</title><link rel="stylesheet" href="/style.css"></head><body><header><div><h1>Kumrawat Admin</h1><p>Orders Dashboard</p></div><a class="call" href="/">🏠 Website</a></header><main><section class="card"><h2>Orders</h2><p>Browser will ask for your admin username/password.</p><button onclick="load()">Refresh Orders</button><div id="list"></div></section></main><script>
async function load(){let r=await fetch("/api/admin/orders");if(!r.ok){document.getElementById("list").innerHTML="<p>Login required or invalid login.</p>";return}let a=await r.json();document.getElementById("list").innerHTML=a.length?a.map(o=>`<article class="card"><h3>${o.id}</h3><p><b>${o.name}</b> — ${o.phone}</p><p>${o.service} | ${o.copies} copies | ${o.size} | ${o.color}</p><p>Status: <select onchange="update('${o.id}','status',this.value)"><option ${o.status==="New"?"selected":""}>New</option><option ${o.status==="Accepted"?"selected":""}>Accepted</option><option ${o.status==="Printing"?"selected":""}>Printing</option><option ${o.status==="Ready"?"selected":""}>Ready</option><option ${o.status==="Delivered"?"selected":""}>Delivered</option></select> Payment: <select onchange="update('${o.id}','payment',this.value)"><option ${o.payment==="Pending"?"selected":""}>Pending</option><option ${o.payment==="Paid"?"selected":""}>Paid</option></select></p>${o.file?`<p><a href="/api/admin/file/${o.id}">📥 Download ${o.file.original}</a></p>`:"<p>No file uploaded.</p>"}<p>${o.notes||""}</p></article>`).join(""):"<p>No orders yet.</p>"}
async function update(id,k,v){await fetch("/api/admin/orders/"+id,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({[k]:v})});}
load();
</script></body></html>
