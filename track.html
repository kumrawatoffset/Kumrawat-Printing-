<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Track Order - Kumrawat</title><link rel="stylesheet" href="/style.css"></head><body><header><div><h1>Kumrawat Offset and Photocopy</h1><p>Track Your Order</p></div><a class="call" href="/">🏠 Home</a></header><main><section class="card"><h2>Order Tracking</h2><form id="track"><label>Order Number<input id="id" required placeholder="Example: KOP-20260821-ABC123"></label><button>Track Order</button></form><div id="result"></div></section></main><script>
const q=new URLSearchParams(location.search).get("order");if(q)document.getElementById("id").value=q;
document.getElementById("track").addEventListener("submit",async e=>{e.preventDefault();let id=document.getElementById("id").value.trim(),r=await fetch("/api/orders/"+encodeURIComponent(id)),d=await r.json(),x=document.getElementById("result");if(!r.ok){x.innerHTML="<p>❌ Order not found.</p>";return}x.innerHTML=`<div class="card"><h3>${d.id}</h3><p><b>Status:</b> ${d.status}</p><p><b>Payment:</b> ${d.payment}</p><p><b>Service:</b> ${d.service}</p><p><b>Copies:</b> ${d.copies} | <b>Size:</b> ${d.size} | <b>Print:</b> ${d.color}</p><p>We will contact you on your registered mobile number for confirmation.</p></div>`});
</script></body></html>
